name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  adapter-schema:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python schema validator
        run: |
          python3 -m venv .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install 'jsonschema[format]==4.25.1'
      - name: Validate adapter samples through schema and Rust ingest
        run: .venv-jsonschema/bin/python scripts/validate_adapter_samples.py
      - name: Validate Generic Lab Kit adapter contract
        run: .venv-jsonschema/bin/python scripts/validate_adapter_contract.py

  rust:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Python schema validator
        run: |
          python3 -m venv .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install 'jsonschema[format]==4.25.1'
      - name: Install strict Rust quality tools
        env:
          CARGO_DENY_VERSION: "0.19.6"
          CARGO_LLVM_COV_VERSION: "0.8.7"
          CARGO_MACHETE_VERSION: "0.9.2"
          CARGO_NEXTEST_VERSION: "0.9.136"
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-binstall --locked
          cargo binstall --locked -y \
            cargo-nextest@$CARGO_NEXTEST_VERSION \
            cargo-llvm-cov@$CARGO_LLVM_COV_VERSION \
            cargo-deny@$CARGO_DENY_VERSION \
            cargo-machete@$CARGO_MACHETE_VERSION
      - name: Strict Rust quality gate
        run: scripts/check_rust_quality.sh strict
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budget-report
          path: target/perf-budget-report.json
          if-no-files-found: ignore
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: target/benchmark-report
          if-no-files-found: ignore
