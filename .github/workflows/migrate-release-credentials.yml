name: Migrate existing release credentials
on:
  push:
    branches: ["lza/migrate-release-credentials-0.5.4"]
    paths: [".github/workflows/migrate-release-credentials.yml"]
permissions:
  contents: read
jobs:
  seal:
    if: ${{ github.actor == 'billlza' && github.repository == 'billlza/netdiag-twin' && github.ref == 'refs/heads/lza/migrate-release-credentials-0.5.4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare the system encryption library
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsodium23
      - name: Validate existing Homebrew authentication
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api repos/billlza/homebrew-netdiag-twin --jq '.full_name' | grep -Fx 'billlza/homebrew-netdiag-twin'
      - name: Seal existing values for their destination environments
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYCODE'
          import base64, ctypes, ctypes.util, json, os
          from pathlib import Path
          library = ctypes.util.find_library("sodium")
          if library is None:
              raise SystemExit("libsodium is required")
          sodium = ctypes.CDLL(library)
          sodium.sodium_init.restype = ctypes.c_int
          if sodium.sodium_init() < 0:
              raise SystemExit("libsodium initialization failed")
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          sodium.crypto_box_seal.restype = ctypes.c_int
          sodium.crypto_sign_seed_keypair.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p]
          sodium.crypto_sign_seed_keypair.restype = ctypes.c_int
          sodium.crypto_box_keypair.argtypes = [ctypes.c_void_p, ctypes.c_void_p]
          sodium.crypto_box_seal_open.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p, ctypes.c_void_p]
          check_public = ctypes.create_string_buffer(32)
          check_private = ctypes.create_string_buffer(32)
          check_message = b"credential-transfer-self-test"
          check_ciphertext = ctypes.create_string_buffer(len(check_message) + 48)
          check_plaintext = ctypes.create_string_buffer(len(check_message))
          if sodium.crypto_box_keypair(check_public, check_private) != 0:
              raise SystemExit("Encryption library self-test key generation failed")
          if sodium.crypto_box_seal(check_ciphertext, check_message, len(check_message), check_public) != 0:
              raise SystemExit("Encryption library self-test sealing failed")
          if sodium.crypto_box_seal_open(check_plaintext, check_ciphertext, len(check_ciphertext), check_public, check_private) != 0 or check_plaintext.raw != check_message:
              raise SystemExit("Encryption library self-test round trip failed")
          print("Sealed-box encryption library round trip verified.")
          settings = {'SPARKLE_PRIVATE_KEY': {'environment': 'release-signing', 'key_id': '3380204578043523366', 'key': 'yhmZVDFRJUmd88uKEu4SRr9/vHqla1SW3fTtf9XYjiw='}, 'HOMEBREW_TAP_TOKEN': {'environment': 'release-homebrew', 'key_id': '3380204578043523366', 'key': 'LZYhA9vJ0xhnLfaQVbD9oJZltE97ebT+XjgTJd5pZwo='}}
          expected_public = base64.b64decode('SUoNVl2i3KCQJqV7wNA1GTHf6yRyM6+PEXqWKHGlVas=', validate=True)
          private_values = {name: os.environ.pop(name, "").encode() for name in settings}
          if not all(private_values.values()):
              raise SystemExit("A required existing repository secret is missing")
          seed = base64.b64decode(private_values["SPARKLE_PRIVATE_KEY"], validate=True)
          if len(seed) != 32:
              raise SystemExit("Existing Sparkle secret needs its legacy format verifier")
          public = ctypes.create_string_buffer(32)
          private = ctypes.create_string_buffer(64)
          if sodium.crypto_sign_seed_keypair(public, private, seed) != 0 or public.raw != expected_public:
              raise SystemExit("Existing Sparkle secret does not match the installed app public key")
          output = Path(os.environ["RUNNER_TEMP"]) / "sealed-release-settings"
          output.mkdir(mode=0o700)
          for name, setting in settings.items():
              key = base64.b64decode(setting["key"], validate=True)
              if len(key) != 32:
                  raise SystemExit("Invalid target environment public key")
              value = private_values.pop(name)
              encrypted = ctypes.create_string_buffer(len(value) + 48)
              if sodium.crypto_box_seal(encrypted, value, len(value), key) != 0:
                  raise SystemExit("Environment secret sealing failed")
              record = {"schema": "netdiag-environment-secret-transfer/v1", "repository": "billlza/netdiag-twin", "environment": setting["environment"], "secret_name": name, "key_id": setting["key_id"], "encrypted_value": base64.b64encode(encrypted.raw).decode(), "workflow_sha": os.environ["GITHUB_SHA"], "workflow_run_id": os.environ["GITHUB_RUN_ID"]}
              destination = output / (name + ".json")
              destination.write_text(json.dumps(record, indent=2) + "\n")
              destination.chmod(0o600)
          print("Sealed two existing repository secrets exclusively for their GitHub environment keys; Sparkle public key continuity verified.")
          PYCODE
      - name: Transfer GitHub-encrypted settings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-release-settings
          path: ${{ runner.temp }}/sealed-release-settings/*.json
          if-no-files-found: error
          retention-days: 1
