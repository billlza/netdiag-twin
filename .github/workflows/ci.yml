name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  adapter-schema:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python schema validator
        run: |
          python3 -m venv .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install 'jsonschema[format]==4.25.1'
      - name: Validate adapter samples through schema and Rust ingest
        run: .venv-jsonschema/bin/python scripts/validate_adapter_samples.py

  rust:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Warning-deny test
        run: RUSTFLAGS="-D warnings" cargo test --workspace
      - name: Architecture guard
        run: scripts/check_architecture_guard.sh
      - name: Performance budget
        run: scripts/check_perf_budget.sh
      - name: Install Python schema validator for benchmark
        run: |
          python3 -m venv .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install 'jsonschema[format]==4.25.1'
      - name: Benchmark report
        run: cargo run --quiet --release -p netdiag-cli -- benchmark run --artifacts target/benchmark-artifacts --output target/benchmark-report
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-budget-report
          path: target/perf-budget-report.json
          if-no-files-found: ignore
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: target/benchmark-report
          if-no-files-found: ignore
