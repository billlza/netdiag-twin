[workspace]
members = [
    "crates/netdiag-core",
    "crates/netdiag-cli",
    "crates/netdiag-app",
    "crates/netdiag-platform",
    "tools/patch-contracts/argmin",
    "tools/dependency-contracts/wayland-scanner",
]
exclude = [
    "third_party/argmin-0.11.0",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.5.4"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.6", features = ["derive"] }
command-group = "5.0.1"
csv = "1.4.0"
# Keep shared desktop features platform-neutral. Linux window backends are enabled
# only by netdiag-app's Linux target dependency so Windows never compiles Unix APIs.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "web_screen_reader", "wgpu"] }
float-cmp = "0.10.0"
getrandom = "0.4.3"
insta = "1.48.0"
linfa = { version = "0.8.1", features = ["serde"] }
linfa-logistic = { version = "0.8.1", features = ["serde"] }
muda = { version = "0.20.0", default-features = false }
# linfa 0.8.1 exposes ndarray 0.16 types; keep its latest compatible release.
ndarray = { version = "0.16.1", features = ["serde"] }
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "metrics"] }
pcap = "2.5.0"
petgraph = "0.8.3"
prost = "0.14.4"
rand = { version = "0.10.2", features = ["std", "std_rng"] }
rand_distr = "0.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rfd = "0.17.2"
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
# Preserve persisted model parameters and thresholds across JSON reads and writes.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
skrifa = "0.47.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tonic = "0.14.6"
tower = { version = "0.5.3", features = ["limit"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita-notitle", "wayland-dlopen"] }
zeroize = "1.9.0"
etherparse = "0.21.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Remove each local patch after its documented upstream release is available.
# Exact provenance, behavioral scope, and removal conditions live in the
# corresponding third_party/*/PATCH.md file.
[patch.crates-io]
argmin = { path = "third_party/argmin-0.11.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
