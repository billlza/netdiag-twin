name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  platform-security:
    uses: ./.github/workflows/platform-security.yml

  workflow-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ACTIONLINT_REVISION: "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
      - name: Install Python quality dependencies
        run: |
          python3 -m venv --clear --copies .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-jsonschema.lock
      - name: Validate shell and workflow contracts
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_REVISION"
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
          python3 scripts/check_release_gate_hygiene.py
          python3 scripts/check_docs_workflow_hygiene.py
      - name: Install pinned ripgrep for runtime guards
        run: |
          set -euo pipefail
          ripgrep_root="$RUNNER_TEMP/netdiag-ripgrep"
          scripts/install_pinned_ripgrep.sh "$ripgrep_root"
          ripgrep_bin_dir="$ripgrep_root/bin"
          printf '%s\n' "$ripgrep_bin_dir" >> "$GITHUB_PATH"
      - name: Run Python quality guard tests
        run: .venv-jsonschema/bin/python -W error::ResourceWarning scripts/test_quality_guards.py

  adapter-schema:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/adapter-validator
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Silence Git default branch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolate Rustup installation
        run: |
          set -euo pipefail
          netdiag_rustup_root="$(mktemp -d "$RUNNER_TEMP/netdiag-rustup.XXXXXX")"
          printf 'RUSTUP_HOME=%s\n' "$netdiag_rustup_root" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install Python schema validator
        run: |
          python3 -m venv --clear --copies .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-jsonschema.lock
      - name: Build Rust ingest validator
        run: cargo build --locked --quiet -p netdiag-cli --bin netdiag-cli
      - name: Validate adapter samples through schema and Rust ingest
        run: .venv-jsonschema/bin/python scripts/validate_adapter_samples.py --rust-validator "$CARGO_TARGET_DIR/debug/netdiag-cli"
      - name: Validate Generic Lab Kit adapter contract
        run: .venv-jsonschema/bin/python scripts/validate_adapter_contract.py --rust-validator "$CARGO_TARGET_DIR/debug/netdiag-cli"

  rust:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Silence Git default branch hint
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Python schema validator
        run: |
          python3 -m venv --clear --copies .venv-jsonschema
          .venv-jsonschema/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-jsonschema.lock
      - name: Install strict Rust quality tools
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_LLVM_COV_VERSION: "0.9.1"
          CARGO_MACHETE_VERSION: "0.9.2"
          CARGO_NEXTEST_VERSION: "0.9.144"
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          cargo install cargo-nextest --version "$CARGO_NEXTEST_VERSION" --locked --quiet
          cargo install cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION" --locked --quiet
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --quiet
          cargo install cargo-machete --version "$CARGO_MACHETE_VERSION" --locked --quiet
      - name: Bind vendored patches to published source archives
        run: |
          mkdir -p target/upstream-crates
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output target/upstream-crates/argmin-0.11.0.crate \
            https://static.crates.io/crates/argmin/argmin-0.11.0.crate
          python3 scripts/check_patch_contract_hygiene.py --archive-dir target/upstream-crates
      - name: Install pinned ripgrep for strict guards
        run: |
          set -euo pipefail
          ripgrep_root="$RUNNER_TEMP/netdiag-ripgrep"
          scripts/install_pinned_ripgrep.sh "$ripgrep_root"
          ripgrep_bin_dir="$ripgrep_root/bin"
          printf '%s\n' "$ripgrep_bin_dir" >> "$GITHUB_PATH"
      - name: Strict Rust quality gate
        id: strict_quality
        run: scripts/check_rust_quality.sh strict
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-budget-report
          path: target/perf-budget-report.json
          if-no-files-found: ignore
      - name: Upload successful benchmark report
        if: ${{ always() && steps.strict_quality.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: target/benchmark-reports
          if-no-files-found: error
      - name: Upload failed benchmark diagnostics
        if: ${{ always() && steps.strict_quality.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report-failure
          path: |
            target/pilot-smoke.*/benchmark-report
            target/benchmark-reports/pilot-smoke.*
          if-no-files-found: ignore
